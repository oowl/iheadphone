[package]
name = "iheadphone-transport"
description = "Platform RFCOMM transport for iHeadphone"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iheadphone-airpods-protocol.workspace = true
iheadphone-sony-protocol.workspace = true
async-channel = "2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"
