[package]
name = "iheadphone-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "iheadphone"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
image.workspace = true
iheadphone-airpods-protocol.workspace = true
iheadphone-domain.workspace = true
iheadphone-sony-protocol.workspace = true
iheadphone-transport.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
async-channel = "2"
block = "0.1.6"
objc = "0.2.7"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
